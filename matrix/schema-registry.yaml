rows:
  - id: schema-registry.register-and-compat
    group: schema-registry
    title: "Confluent Schema Registry stores schemas in its compacted Kafka topic: two backward-compatible versions register with distinct ids, an incompatible change is rejected, the store topic has 1 partition and cleanup.policy=compact"
