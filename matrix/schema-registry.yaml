    provenance: kubemq-authored
    source: suites/tools/probe/schemaregistry.go (confluentinc/cp-schema-registry 8.3.2; ported from kubemq-server tests/kafka-ecosystem/schema-registry.sh)
  - id: schema-registry.restart-rebuild
    group: schema-registry
    title: "After a registry restart, the subject's versions [1,2] and schema id 2 are rebuilt byte-identical from the store topic alone"
