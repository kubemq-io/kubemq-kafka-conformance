# Track C client rows. Every client runs the same scenario (suites/clients/SCENARIO.md) through a
# small driver in a container, on the Kafka oracle first, then on KubeMQ with only the bootstrap
# address changed. Two rows per client: the full scenario (allowed deviation only
# group.protocol=classic) and stock defaults (zero overrides, upstream quickstart), which records
# the group protocol the pinned client actually uses.
#   client   the name the driver reports; version  the pinned version the driver must have loaded
#   driver   suites/clients/drivers/<driver>;    admin  false when the client has no admin API
#   limits   client limitations this row allows, published with the row: assignment-hidden (the
#            consumer API does not expose its group assignment), ack-offsets-unknown (the producer
#            reports no offsets), headers-per-run (a command-line tool sets headers per run, so
#            records carry only the client header), commit-on-close (the consumer commits only on
#            close, by the client's auto commit; committed offsets are still checked); the
#            verifier then skips or adapts only those
track: clients
rows:
  - id: clients.franz-go.scenario
    title: "franz-go: create 3-partition topic, 300 keyed records acks=all, group consume and commit, 100 more, second member resumes from the committed offsets"
    client: franz-go
    version: v1.22.0
    driver: franzgo
    mode: scenario
    provenance: kubemq-authored
    source: suites/clients/drivers/franzgo (scenario in suites/clients/SCENARIO.md)
  - id: clients.franz-go.stock-defaults
    title: "franz-go stock defaults: zero overrides, topic with broker defaults, consumer group subscribes, 10 records produced and received"
    client: franz-go
    version: v1.22.0
    driver: franzgo
    mode: stock-defaults
    provenance: kubemq-authored
    source: suites/clients/drivers/franzgo (scenario in suites/clients/SCENARIO.md)
