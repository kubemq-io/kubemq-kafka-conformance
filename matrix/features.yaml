    provenance: kubemq-authored
    source: suites/features/probe/admin.go (franz-go admin)
  - id: features.admin.partition-limit
    group: admin
    title: "Partition count limit: topics with 256 and 300 partitions"
    probe: admin-partition-limit
    provenance: kubemq-authored
    source: suites/features/probe/admin.go (franz-go admin)
  - id: features.admin.configs
    group: admin
    title: "Topic configs: value set at creation described back; incremental alter set and delete"
    probe: admin-configs
    provenance: kubemq-authored
    source: suites/features/probe/admin.go (franz-go admin)
  - id: features.admin.groups
    group: admin
    title: "Groups: list, describe (state, protocol, members), delete refused while non-empty, allowed when empty"
