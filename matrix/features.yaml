  - id: features.fetch.long-poll
    group: fetch
    title: "Long poll: fetch.min.bytes unmet waits fetch.max.wait.ms (2 s); data arriving mid-wait answers early"
    probe: fetch-long-poll
    provenance: kubemq-authored
    source: suites/features/probe/fetch.go (raw Fetch requests through franz-go)
